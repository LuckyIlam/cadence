[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
ignore = [
    # h2 0.3.x (via hyper 0.14 <- libsql 0.9.30) : RUSTSEC-2026-0258
    # (DATA frames vides non bornées, DoS HTTP/2). Pas de correctif sur la
    # ligne 0.3.x (fix >=0.4.16 = hyper 1.x) : à lever quand libsql stable
    # migrera sur hyper 1.x (actuellement 0.10 en pré-release).
    # Exposition limitée : client HTTP/2 vers le serveur Turso configuré.
    "RUSTSEC-2026-0258",
    # proc-macro-error: dépendance transitive de glib/gtk.
    "RUSTSEC-2024-0370",
    # unic-*: dépendances transitives de tauri-utils via urlpattern.
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2025-0098",
    # rustls-webpki 0.102: imposé par rustls 0.22 de libsql 0.9.x (hyper-rustls 0.25).
    # Correctifs publiés sur la ligne >=0.103 (rustls 0.23) : à lever quand libsql
    # publie une version stable sur rustls 0.23.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # rustls-pemfile: dépendance transitive de rustls 0.22 (stack libsql 0.9.x).
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    # License de libsql-sys (libsql 0.9.x).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-workspace = true

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
